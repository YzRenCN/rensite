
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://www.example.com">
    <title>Redirecting...</title>
    <style>
        /* 确保页面完全不可见，避免闪烁 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
            visibility: hidden;
        }
    </style>
    <script>
        // 立即执行跳转，优先级高于 Meta 标签
        (function() {
            var targetUrl = "https://www.example.com"; // 请修改此处的目标地址
            // 使用 replace 替换当前历史记录，防止用户点击“后退”按钮回到这个空白页
            window.location.replace(targetUrl);
        })();
    </script>
</head>
<body>
    <!-- 页面内容为空，确保无任何显示 -->
</body>
</html>
