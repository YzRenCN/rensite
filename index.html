
<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人网 RenSite</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-gray-800">

    <!-- 主容器 -->
    <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 animate-fade-in">
        
        <!-- 标题 -->
        <h1 class="text-3xl font-extrabold text-center text-gray-900 mb-8 tracking-tight">
            我是人网 RenSite
        </h1>

        <!-- 链接列表 -->
        <div class="space-y-4">
            
            <!-- 链接项 1 -->
            <a href="https://home.rensite.cn/%E9%A6%96%E9%A1%B5" 
               class="block w-full p-4 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md group animate-fade-in delay-100">
                <span class="text-blue-700 font-medium group-hover:text-blue-900">
                    我是中国人网 RenSite
                </span>
            </a>

            <!-- 链接项 2 -->
            <a href="https://huanyexuan.xyz" 
               class="block w-full p-4 bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md group animate-fade-in delay-200">
                <span class="text-purple-700 font-medium group-hover:text-purple-900">
                    huanyexuan网
                </span>
            </a>

            <!-- 链接项 3 -->
            <a href="https://lowsofgov.rensite.cn/" 
               class="block w-full p-4 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md group animate-fade-in delay-300">
                <span class="text-green-700 font-medium group-hover:text-green-900">
                    国家网络安全法学习网站
                </span>
            </a>

            <!-- 链接项 4 -->
            <a href="https://123456.asia" 
               class="block w-full p-4 bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md group animate-fade-in delay-400">
                <span class="text-orange-700 font-medium group-hover:text-orange-900">
                    123456工具网
                </span>
            </a>

        </div>

        <!-- 版权信息 -->
        <footer class="mt-10 text-center text-sm text-gray-400 animate-fade-in delay-400">
            <p>版权所有 &copy; 2026</p>
        </footer>

    </main>

</body>
</html>
