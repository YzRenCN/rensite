
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
</head>
<body>
    <p>正在检测您的网络位置，请稍候...</p>

    <script>
        // 定义目标地址
        const TARGET_CN = "https://www.rensite.cn/home/";
        const TARGET_GLOBAL = "https://human.rensite.cn";

        // 执行跳转函数
        function redirect(url) {
            window.location.replace(url);
        }

        // 获取IP并判断地理位置
        async function checkIpAndRedirect() {
            try {
                // 使用 ipapi.co 获取IP信息 (无需API Key，支持HTTPS)
                const response = await fetch('https://ipapi.co/json/');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                const countryCode = data.country_code; // 获取国家代码，如 "CN", "US"

                console.log("Detected Country Code:", countryCode);

                if (countryCode === 'CN') {
                    // 如果是中国大陆
                    redirect(TARGET_CN);
                } else {
                    // 其他地区
                    redirect(TARGET_GLOBAL);
                }

            } catch (error) {
                console.error("IP detection failed:", error);
                // 如果检测失败，默认跳转到全球站点（可根据需求修改）
                redirect(TARGET_GLOBAL);
            }
        }

        // 页面加载完成后立即执行
        window.addEventListener('load', checkIpAndRedirect);
    </script>
</body>
</html>
