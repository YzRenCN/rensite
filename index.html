<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按国家自动跳转</title>
    <!-- 解决跨域问题，否则 IP 查询接口可能被浏览器拦截 -->
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <h1>正在检测你的地区，即将跳转…</h1>

    <script>
        // 1. 定义回调函数：收到 IP 归属地数据后执行
        function ipCallback(json) {
            if (json.err === "noprovince") {
                // 非中国访客跳转到海外版页面
                window.location.href = "https://human.rensite.cn/";
            } else {
                // 中国访客跳转到国内版页面
                window.location.href = "https://www.rensite.cn/home.html/";
            }
        }
    </script>

    <!-- 2. 引入 IP 归属地查询接口（太平洋网络，免费，2024年仍可用） -->
    <script src="https://whois.pconline.com.cn/ipJson.jsp?callback=ipCallback"></script>
</body>
</html>
