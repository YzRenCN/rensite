<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div>正在根据您的地区跳转，请稍候...</div>

    <script>
        // 使用ip-api.com免费IP定位接口，支持JSONP跨域
        function getLocationAndRedirect() {
            // 创建script标签实现JSONP
            const script = document.createElement('script');
            
            // 回调函数处理定位结果
            window.handleIPResponse = function(data) {
                if (data.status === 'success') {
                    // 判断是否为中国大陆（国家代码CN，且排除港澳台）
                    // 国家代码CN表示中国，进一步判断地区是否为大陆省份
                    const country = data.countryCode;
                    const region = data.regionName;
                    
                    // 港澳台地区列表
                    const hk_mo_tw = ['Hong Kong', 'Macau', 'Taiwan'];
                    
                    if (country === 'CN' && !hk_mo_tw.includes(region)) {
                        // 中国大陆IP，跳转到国内站点
                        window.location.href = 'https://www.rensite.cn/home.html';
                    } else {
                        // 非中国大陆IP，跳转到国际站点
                        window.location.href = 'https://human.rensite.cn/';
                    }
                } else {
                    // 定位失败时默认跳转国内站点，可根据需求修改
                    window.location.href = 'https://www.rensite.cn/home.html';
                }
            };
            
            // 设置超时处理，3秒无响应则默认跳转
            const timeout = setTimeout(function() {
                window.location.href = 'https://www.rensite.cn/home.html';
            }, 3000);
            
            // 调用IP定位API，使用JSONP格式
            script.src = 'http://ip-api.com/json/?lang=zh-CN&fields=status,countryCode,regionName&callback=handleIPResponse';
            document.head.appendChild(script);
            
            // 脚本加载完成后清除超时
            script.onload = function() {
                clearTimeout(timeout);
            };
            
            // 脚本加载失败时默认跳转
            script.onerror = function() {
                clearTimeout(timeout);
                window.location.href = 'https://www.rensite.cn/home.html';
            };
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', getLocationAndRedirect);
    </script>
</body>
</html><!--09548494072395614730091221-->
