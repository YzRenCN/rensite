
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
            color: #374151;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 1rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>正在识别您的地区并跳转，请稍候...</p>
    </div>

    <script>
        function getLocationAndRedirect() {
            // 定义目标地址
            const domesticUrl = 'https://www.rensite.cn/home.html';
            const internationalUrl = 'https://human.rensite.cn/';

            // 创建 JSONP 脚本标签
            const script = document.createElement('script');
            
            // 定义全局回调函数
            window.handleIPResponse = function(data) {
                if (data && data.status === 'success') {
                    const country = data.countryCode;
                    const region = data.regionName;
                    
                    // 需要排除的港澳台地区名称（根据 API 返回可能为英文或拼音）
                    const excludedRegions = ['Hong Kong', 'Macau', 'Taiwan', 'Xianggang', 'Aomen'];
                    
                    // 判断逻辑：国家代码为 CN 且 地区不在排除列表中
                    if (country === 'CN' && !excludedRegions.includes(region)) {
                        window.location.href = domesticUrl;
                    } else {
                        // 其他国家或港澳台地区
                        window.location.href = internationalUrl;
                    }
                } else {
                    // API 返回失败，默认跳转国内
                    window.location.href = domesticUrl;
                }
            };
            
            // 设置超时保护，防止 API 无响应导致页面卡死
            const timeout = setTimeout(function() {
                console.warn('IP定位超时，执行默认跳转');
                window.location.href = domesticUrl;
            }, 3000);
            
            // 【关键修复】使用 HTTPS 协议，避免在 HTTPS 环境下被浏览器拦截
            script.src = 'https://ip-api.com/json/?fields=status,countryCode,regionName&callback=handleIPResponse';
            
            // 加载成功清除超时
            script.onload = function() {
                clearTimeout(timeout);
            };
            
            // 加载失败（如网络错误）执行默认跳转
            script.onerror = function() {
                clearTimeout(timeout);
                console.error('IP定位脚本加载失败');
                window.location.href = domesticUrl;
            };

            document.head.appendChild(script);
        }

        // DOM 加载完成后立即执行
        document.addEventListener('DOMContentLoaded', getLocationAndRedirect);
    </script>
</body>
</html>
