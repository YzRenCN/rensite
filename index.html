
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能地区跳转</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md rounded-2xl shadow-xl p-8 fade-in relative">
        <!-- 设置按钮 -->
        <button id="settingsBtn" class="absolute top-4 right-4 text-gray-400 hover:text-blue-600 transition-colors">
            <i class="fas fa-cog text-xl"></i>
        </button>

        <!-- 主内容区 -->
        <div id="mainContent" class="text-center">
            <div class="mb-6">
                <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto"></div>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">正在识别地区</h2>
            <p class="text-gray-500 mb-6" id="statusText">正在连接定位服务...</p>
            
            <div class="bg-blue-50 rounded-lg p-4 text-left text-sm text-blue-800">
                <p><i class="fas fa-info-circle mr-2"></i>系统将根据您的IP地址自动选择最佳站点。</p>
            </div>
        </div>

        <!-- 设置面板 (默认隐藏) -->
        <div id="settingsPanel" class="hidden absolute inset-0 bg-white rounded-2xl z-10 flex flex-col justify-center p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-sliders-h mr-2 text-blue-600"></i> 容错策略设置
            </h3>
            <p class="text-sm text-gray-500 mb-6">当定位失败或超时时，您希望如何处理？</p>
            
            <div class="space-y-3">
                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition-colors">
                    <input type="radio" name="fallbackStrategy" value="domestic" class="w-4 h-4 text-blue-600" checked>
                    <span class="ml-3 text-gray-700">默认跳转国内站点</span>
                </label>
                
                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition-colors">
                    <input type="radio" name="fallbackStrategy" value="international" class="w-4 h-4 text-blue-600">
                    <span class="ml-3 text-gray-700">默认跳转国际站点</span>
                </label>
                
                <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition-colors">
                    <input type="radio" name="fallbackStrategy" value="stay" class="w-4 h-4 text-blue-600">
                    <span class="ml-3 text-gray-700">停留在当前页并提示</span>
                </label>
            </div>

            <div class="mt-6 flex gap-3">
                <button id="saveSettings" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    保存并继续
                </button>
                <button id="cancelSettings" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition-colors font-medium">
                    取消
                </button>
            </div>
        </div>
    </div>

    <script>
        // 配置项
        const CONFIG = {
            domesticUrl: 'https://www.rensite.cn/home.html',
            internationalUrl: 'https://human.rensite.cn/',
            timeout: 3000
        };

        // 状态管理
        let fallbackStrategy = localStorage.getItem('fallbackStrategy') || 'domestic';
        let isRedirecting = false;

        // DOM 元素
        const statusText = document.getElementById('statusText');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const saveSettingsBtn = document.getElementById('saveSettings');
        const cancelSettingsBtn = document.getElementById('cancelSettings');
        const radioButtons = document.getElementsByName('fallbackStrategy');

        // 初始化设置面板状态
        function initSettings() {
            for (const radio of radioButtons) {
                if (radio.value === fallbackStrategy) {
                    radio.checked = true;
                }
            }
        }

        // 执行跳转
        function performRedirect(url) {
            if (isRedirecting) return;
            isRedirecting = true;
            statusText.textContent = "正在跳转...";
            window.location.href = url;
        }

        // 处理定位结果
        function handleLocationSuccess(data) {
            if (isRedirecting) return;

            if (data && data.status === 'success') {
                const country = data.countryCode;
                const region = data.regionName;
                const excludedRegions = ['Hong Kong', 'Macau', 'Taiwan', 'Xianggang', 'Aomen'];

                statusText.textContent = `识别完成: ${country} - ${region}`;

                if (country === 'CN' && !excludedRegions.includes(region)) {
                    setTimeout(() => performRedirect(CONFIG.domesticUrl), 500);
                } else {
                    setTimeout(() => performRedirect(CONFIG.internationalUrl), 500);
                }
            } else {
                handleFallback();
            }
        }

        // 处理容错逻辑
        function handleFallback() {
            if (isRedirecting) return;
            statusText.textContent = "定位服务异常，执行容错策略";
            
            switch (fallbackStrategy) {
                case 'domestic':
                    setTimeout(() => performRedirect(CONFIG.domesticUrl), 1000);
                    break;
                case 'international':
                    setTimeout(() => performRedirect(CONFIG.internationalUrl), 1000);
                    break;
                case 'stay':
                    statusText.textContent = "无法确定您的地区，请手动选择站点。";
                    statusText.classList.add('text-red-500');
                    // 这里可以扩展显示手动选择按钮
                    break;
            }
        }

        // 启动定位逻辑
        function startLocationCheck() {
            const script = document.createElement('script');
            
            window.handleIPResponse = handleLocationSuccess;
            
            const timeoutId = setTimeout(() => {
                script.remove();
                handleFallback();
            }, CONFIG.timeout);

            script.src = `https://ip-api.com/json/?fields=status,countryCode,regionName&callback=handleIPResponse`;
            
            script.onload = () => clearTimeout(timeoutId);
            script.onerror = () => {
                clearTimeout(timeoutId);
                handleFallback();
            };

            document.head.appendChild(script);
        }

        // 事件监听
        settingsBtn.addEventListener('click', () => {
            initSettings();
            settingsPanel.classList.remove('hidden');
        });

        cancelSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('hidden');
        });

        saveSettingsBtn.addEventListener('click', () => {
            for (const radio of radioButtons) {
                if (radio.checked) {
                    fallbackStrategy = radio.value;
                    localStorage.setItem('fallbackStrategy', fallbackStrategy);
                    break;
                }
            }
            settingsPanel.classList.add('hidden');
            // 如果之前已经超时且停留在页面，重新触发一次检查或立即执行策略
            if (!isRedirecting && statusText.textContent.includes("异常")) {
                handleFallback();
            }
        });

        // 页面加载完成后启动
        document.addEventListener('DOMContentLoaded', startLocationCheck);
    </script>
</body>
</html>
